[workspace]
resolver = "2"
members = [
    "crates/seekpower-error",
    "crates/seekpower-storage",
    "crates/seekpower-persistence",
    "crates/seekpower-schema",
    "crates/seekpower-docstore",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
seekpower-error  = { path = "crates/seekpower-error" }
seekpower-storage = { path = "crates/seekpower-storage" }
seekpower-persistence = { path = "crates/seekpower-persistence" }
seekpower-schema = { path = "crates/seekpower-schema" }
seekpower-docstore = { path = "crates/seekpower-docstore" }

# External dependencies (shared versions)
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
slatedb = "0.14"
object_store = "0.14"
ahash = { version = "0.8", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
smallvec = "1"
rayon = "1"
itertools = "0.14"
snap = "1"
lz4_flex = "0.13"
zstd = "0.13"
bytemuck = "1"
stop-words = "0.8"
bytes = "1.10"
async-trait = "0.1"
hex = "0.4"
sha2 = "0.10"
moka = { version = "0.12", features = ["future", "sync"] }
metrics = "0.24"
tempfile = "3"
bincode = "1.3"
crc32fast = "1.4"
roaring = "0.10"
opendal = { version = "0.57", features = ["services-fs", "services-s3"] }
chrono = "0.4.45"
