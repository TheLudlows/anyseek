[workspace]
resolver = "3"
members = [
    "anyseek"
]

[workspace.lints.rust]
missing_docs = "warn"
unused_import_braces = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[profile.release]
lto = true
opt-level = 3
debug = false
debug-assertions = false
# Production panics terminate the process; recovery replays durable authority.
# catch_unwind is defensive for unwind builds, not production task isolation.
panic = "abort"
overflow-checks = false
strip = "debuginfo"
