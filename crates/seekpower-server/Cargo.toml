[package]
name = "seekpower-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "seekpower-server"
path = "src/main.rs"

[dependencies]
seekpower-core = { workspace = true }
seekpower-error = { workspace = true }
seekpower-schema = { workspace = true }
seekpower-search = { workspace = true }
seekpower-storage = { workspace = true }
seekpower-tokenizer = { workspace = true }
seekpower-vector = { workspace = true }
axum = { version = "0.7", features = ["macros"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
object_store = "0.12"
anyhow = "1"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
