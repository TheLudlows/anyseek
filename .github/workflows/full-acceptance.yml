name: Full acceptance (manual)

on:
  workflow_dispatch:
  workflow_call:

env:
  ANYSEEK_TEST_SCALE: full

permissions:
  contents: read

concurrency:
  group: full-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    # This job also installs the console's pinned Playwright 1.56.1 browsers.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # target-cpu=native artifacts cannot be shared across heterogeneous runners.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: s12-native-source-only
          cache-targets: false
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
          lscpu
      - name: Verify standalone console boundary
        run: python3 scripts/check_console_boundary.py
      - name: Build retained workspace
        id: build
        run: cargo build --workspace
      - name: Verify retired dependencies removed
        run: python3 scripts/check_retired_dependencies.py
      - name: HTTP API smoke (no SDK)
        run: python3 scripts/record_service_smoke.py --server target/debug/anyseek_server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Standalone console browser acceptance
        working-directory: console
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-full-browser-results
          path: console/test-results/
      - name: Existing module and service tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --workspace --all-targets
      - name: Build release panic probe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo build -p anyseek --locked --release --features fault-injection --example runtime_panic_probe
      - name: Release panic and recovery subprocesses
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ulimit -c 0
          python3 scripts/release_panic_smoke.py --probe target/release/examples/runtime_panic_probe
      - name: Generate API reference
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          target/debug/anyseek_server generate_openapi=true > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: |
            target/debug/openapi.json
            target/debug/openapi.yml

  persistence-native:
    name: Persistence primitives (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Includes cold-cache S3 checkpoints and joint-archive process fault matrices.
    timeout-minutes: 120
    env:
      ANYSEEK_TEST_ROOT: ${{ github.workspace }}/target/p1-native-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native toolchain
        run: rustc --version --verbose
      - name: Native Windows filesystem evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testDrive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':')
          Get-Volume -DriveLetter $testDrive | Format-List DriveLetter,FileSystem,HealthStatus
          Get-ComputerInfo -Property WindowsProductName,OsVersion
      - name: Native Linux filesystem evidence
        if: runner.os == 'Linux'
        run: |
          uname -a
          findmnt -T "$GITHUB_WORKSPACE" -o SOURCE,FSTYPE,TARGET
      - name: Native default-feature unit contracts (Windows)
        if: runner.os == 'Windows'
        # Linux default-feature unit tests run in build-and-smoke. Libtest runs
        # each Windows case once even if several filters match its name.
        run: >-
          cargo test -p anyseek --lib --
          journal_ partition_ record::lexical:: component:: record::tests
          record::indexer::tests sqlite_authority::index_build::tests
          background_index expired_remote_index catalog_ verified_cache
          cache_corruption record_service::tests resources::tests resource_
      - name: Native fault-feature module and service contracts
        if: runner.os != 'Windows'
        # Linux default-feature integration targets run in build-and-smoke.
        run: cargo test -p anyseek --lib --bins --features fault-injection
      - name: Native SDK, service and feature contracts without optional features
        run: |
          cargo test -p anyseek --no-default-features --bins --test local_sdk --test tokenizer_profiles --test text_normalization
          cargo test -p anyseek --no-default-features --lib -- record::state_chunks::tests::chunks_preserve_records_receipts_opaque_json_and_owned_residency server::record_service::diagnostic_tests::
      - name: Native documentation without optional features
        run: cargo test -p anyseek --no-default-features --doc
      - name: Native default documentation
        run: cargo test -p anyseek --doc
      - name: Build native service
        if: runner.os == 'Windows'
        run: cargo build -p anyseek
      - name: Native service HTTP and restart acceptance (Windows)
        # Linux normal HTTP is included in build-and-smoke; console browser checks run separately.
        if: runner.os == 'Windows'
        run: python scripts/record_service_smoke.py --server target/debug/anyseek_server.exe
      - name: Build explicit fault-injection service (not release binary)
        run: cargo build -p anyseek --features fault-injection
      - name: Native real HTTP process fault and recovery matrix
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/record_service_smoke.py --server target/debug/anyseek_server.exe --faults
          else
            python3 scripts/record_service_smoke.py --server target/debug/anyseek_server --faults
          fi
      - name: Native concurrent Indexer HTTP authorization and restart
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/record_service_smoke.py --server target/debug/anyseek_server.exe --faults --section indexer
          else
            python3 scripts/record_service_smoke.py --server target/debug/anyseek_server --faults --section indexer
          fi
      - name: Native S3 checkpoint retention and joint backup fault matrix
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/s3_storage_smoke.py --server target/debug/anyseek_server.exe --faults
          else
            python3 scripts/s3_storage_smoke.py --server target/debug/anyseek_server --faults
          fi
      - name: Native independent collection execution and scoped revocation HTTP
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/record_service_smoke.py --server target/debug/anyseek_server.exe --faults --section authorization
          else
            python3 scripts/record_service_smoke.py --server target/debug/anyseek_server --faults --section authorization
          fi

  windows-fault-tests:
    name: Windows fault-injection (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ANYSEEK_TEST_ROOT: ${{ github.workspace }}/target/p1-native-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native fault-feature module and service contracts
        if: matrix.suite == 'unit'
        run: cargo test -p anyseek --lib --bins --features fault-injection
      - name: Verify Windows lexical partition
        if: matrix.suite == 'integration'
        run: python scripts/check_lexical_partition.py
      - name: Native retained public Record integration contracts (Windows remainder)
        if: matrix.suite == 'integration'
        # The four exact large cases run below on independent Windows runners.
        run: >-
          cargo test -p anyseek --test '*' --features fault-injection --
          --skip five_term_union_scores_and_topk_prefix_
          --skip mixed_term_membership_scores_and_query_order_

  windows-lexical:
    name: Windows lexical (${{ matrix.test }})
    strategy:
      fail-fast: false
      matrix:
        test:
          - five_term_union_scores_and_topk_prefix_shared
          - five_term_union_scores_and_topk_prefix_per_field
          - mixed_term_membership_scores_and_query_order_shared
          - mixed_term_membership_scores_and_query_order_per_field
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native toolchain
        run: rustc --version --verbose
      - name: Verify complete partition and run exact full-size case
        run: python scripts/check_lexical_partition.py --case ${{ matrix.test }}

  s3-native-acceptance:
    name: S3 semantics and contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ANYSEEK_TEST_ROOT: ${{ github.workspace }}/target/s3-native-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: s3-source-only
          cache-targets: false
      - name: Prepare isolated test roots
        shell: bash
        run: mkdir -p target/s3-native-data
      - name: Build explicit fault-injection service
        run: cargo build -p anyseek --features fault-injection
      # Same-feature remote_checkpoint library tests run in persistence-native
      # on Linux and windows-fault-tests on Windows.
      - name: Immutable object and joint-backup contract (HTTP fixture)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/s3_acceptance.py --backend fixture --suite contract --report target/s3-contract.json
          else
            python3 scripts/s3_acceptance.py --backend fixture --suite contract --report target/s3-contract.json
          fi
      - name: Shared Record semantics after S3 cache loss
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/s3_acceptance.py --backend fixture --suite semantic --server target/debug/anyseek_server.exe --faults --report target/s3-semantics.json
          else
            python3 scripts/s3_acceptance.py --backend fixture --suite semantic --server target/debug/anyseek_server --faults --report target/s3-semantics.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3-acceptance-${{ matrix.os }}
          path: |
            target/s3-contract.json
            target/s3-semantics.json
