name: Retained workspace

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retained-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # target-cpu=native artifacts cannot be shared across heterogeneous runners.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: s12-native-source-only
          cache-targets: false
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
          lscpu
      - name: Verify standalone core boundary
        run: python3 scripts/check_core_boundary.py
      - name: Verify documentation links and product identifiers
        run: python3 scripts/check_docs_brand.py
      - name: Build retained workspace
        id: build
        run: cargo build --workspace --features server
      - name: Verify retired dependencies removed
        run: |
          cargo metadata --format-version 1 > /tmp/anyseek-metadata.json
          python3 - <<'PYCODE'
          import json
          with open('/tmp/anyseek-metadata.json') as source:
              packages = json.load(source)['packages']
              names = {package['name'] for package in packages}
          forbidden = names & {'pdfium-render', 'csv', 'walkdir', 'symspell_complete_rs', 'model2vec-rs', 'rkyv', 'tabled', 'colored', 'num-format', 'crossbeam-channel', 'ctrlc', 'half', 'lz4_flex', 'zstd', 'snowball_stemmers_rs', 'gxhash', 'zstd-safe', 'zstd-sys'}
          assert not forbidden, f'retired dependencies remain: {forbidden}'
          core = next(package for package in packages if package['name'] == 'anyseek')
          assert not any(dependency['name'] == 'aho-corasick' for dependency in core['dependencies']), 'direct highlighter dependency remains'
          # The tokenizer retains regex-syntax; optional API dependencies are checked separately.
          print('PASS no direct highlighter dependency')
          print('PASS no PDF/CSV/directory parser or query rewriting dependencies in resolved graph')
          PYCODE
      - name: Install browser test runtime
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: HTTP API and embedded UI smoke (no SDK)
        env:
          ANYSEEK_BROWSER_TEST: "1"
        run: python3 scripts/record_service_smoke.py --server target/debug/anyseek_server --browser
      - name: Existing core and server tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --workspace --features server --all-targets
      - name: Generate API reference
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          target/debug/anyseek_server generate_openapi=true > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: |
            target/debug/openapi.json
            target/debug/openapi.yml

  persistence-native:
    name: Persistence primitives (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ANYSEEK_TEST_ROOT: ${{ github.workspace }}/target/p1-native-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native toolchain
        run: rustc --version --verbose
      - name: Native Windows filesystem evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testDrive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':')
          Get-Volume -DriveLetter $testDrive | Format-List DriveLetter,FileSystem,HealthStatus
          Get-ComputerInfo -Property WindowsProductName,OsVersion
      - name: Native Linux filesystem evidence
        if: runner.os == 'Linux'
        run: |
          uname -a
          findmnt -T "$GITHUB_WORKSPACE" -o SOURCE,FSTYPE,TARGET
      - name: Native journal and child-process crash tests
        run: cargo test -p anyseek --lib journal_
      - name: Native partition publication and owner-lock tests
        run: cargo test -p anyseek --lib partition_
      - name: Native existing-index I/O errors and mapping lifecycle
        run: cargo test -p anyseek --lib commit_io_tests
      - name: Native record replay, snapshot and response-loss tests
        run: cargo test -p anyseek --lib record::tests
      - name: Native catalog authorization and revocation recovery tests
        run: cargo test -p anyseek --lib catalog_
      - name: Native service output and admission barriers
        run: cargo test -p anyseek --features server record_service::tests
      - name: Build native service
        run: cargo build -p anyseek --features server
      - name: Native service HTTP and restart acceptance
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/record_service_smoke.py --server target/debug/anyseek_server.exe
          else
            python3 scripts/record_service_smoke.py --server target/debug/anyseek_server
          fi
      - name: Build explicit fault-injection service (not release binary)
        run: cargo build -p anyseek --features server,fault-injection
      - name: Native real HTTP process fault and recovery matrix
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/record_service_smoke.py --server target/debug/anyseek_server.exe --faults
          else
            python3 scripts/record_service_smoke.py --server target/debug/anyseek_server --faults
          fi
