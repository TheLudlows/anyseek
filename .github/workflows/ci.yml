name: PR feedback

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full:
        description: Run complete manual acceptance on the selected ref
        type: boolean
        default: false


permissions:
  contents: read

concurrency:
  group: pr-feedback-${{ github.ref }}-${{ inputs.full && 'full' || 'quick' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-source-only
          cache-targets: false
      - name: Determine validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          base = os.environ.get('BASE_SHA', '')
          code = True
          if base and set(base) != {'0'}:
              files = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              code = any(not (p.endswith('.md') or p.startswith('docs/')) for p in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'code={str(code).lower()}\n')
          PYCODE
      - name: Verify documentation links and product identifiers
        run: python3 scripts/check_docs_brand.py
      - name: Verify document editor numeric precision and retries
        if: steps.scope.outputs.code == 'true'
        run: node --test scripts/document_precision.test.cjs
      - name: Verify standalone core boundary
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/check_core_boundary.py
      - name: Verify full-size lexical partition remains complete
        run: python3 scripts/check_lexical_partition.py --source-only
      - name: Verify retired dependencies removed
        if: steps.scope.outputs.code == 'true'
        run: |
          cargo metadata --format-version 1 > /tmp/anyseek-metadata.json
          python3 - <<'PYCODE'
          import json
          with open('/tmp/anyseek-metadata.json') as source:
              metadata = json.load(source)
              packages = metadata['packages']
              names = {package['name'] for package in packages}
          forbidden = names & {'pdfium-render', 'csv', 'walkdir', 'symspell_complete_rs', 'model2vec-rs', 'rkyv', 'tabled', 'colored', 'num-format', 'ctrlc', 'half', 'snowball_stemmers_rs', 'gxhash'}
          assert not forbidden, f'retired dependencies remain: {forbidden}'
          core = next(package for package in packages if package['name'] == 'anyseek')
          # Native Tantivy uses channels and LZ4 internally. Permit those only
          # behind its dependency edge; do not restore old direct code paths.
          native_only = {'crossbeam-channel', 'lz4_flex'}
          assert not native_only & {d['name'] for d in core['dependencies']}
          by_id = {p['id']: p for p in packages}
          nodes = {n['id']: n for n in metadata['resolve']['nodes']}
          seen, pending = set(), [core['id']]
          while pending:
              current = pending.pop()
              if current in seen or by_id[current]['name'] == 'tantivy':
                  continue
              seen.add(current)
              pending.extend(d['pkg'] for d in nodes[current]['deps'])
          assert not native_only & {by_id[p]['name'] for p in seen}, 'native-only dependency escaped Tantivy'
          # Jieba's embedded dictionary uses include-flate/Zstd. Permit it only
          # beneath jieba-rs, never as a direct/alternative storage codec.
          dictionary_only = {'zstd', 'zstd-safe', 'zstd-sys'}
          seen, pending = set(), [core['id']]
          while pending:
              current = pending.pop()
              if current in seen or by_id[current]['name'] == 'jieba-rs':
                  continue
              seen.add(current)
              pending.extend(d['pkg'] for d in nodes[current]['deps'])
          assert not dictionary_only & {by_id[p]['name'] for p in seen}, 'dictionary codec escaped Jieba'
          assert not any(dependency['name'] == 'aho-corasick' for dependency in core['dependencies']), 'direct highlighter dependency remains'
          # The tokenizer retains regex-syntax; optional API dependencies are checked separately.
          print('PASS no direct highlighter dependency')
          print('PASS no PDF/CSV/directory parser or query rewriting dependencies in resolved graph')
          PYCODE

  core:
    name: Core feedback (${{ matrix.os }}, ${{ matrix.lane }})
    needs: static
    if: needs.static.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        lane: [core, lexical]
    runs-on: ${{ matrix.os }}
    # Windows took 734s for the local long-suffix case; the remote case
    # was still running at the 30m job limit. Keep test data and timeouts.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.lane == 'core' && 45 || 30 }}
    env:
      # Generic CPU makes target artifacts portable across runners of this OS.
      RUSTFLAGS: "-C target-cpu=x86-64"
      RUSTDOCFLAGS: "-C target-cpu=x86-64"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      ANYSEEK_TEST_SCALE: small
      ANYSEEK_TEST_ROOT: ${{ github.workspace }}/target/anyseek-ci-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-generic-core-v1
      - name: Prepare isolated test root
        shell: bash
        run: mkdir -p "$ANYSEEK_TEST_ROOT"
      - name: Exact bounded core regressions (including WAL owner lock)
        if: matrix.lane == 'core'
        run: python scripts/ci_core_cases.py
      - name: Small deletion and ranking oracles
        if: matrix.lane == 'core'
        run: >-
          cargo test -p anyseek --locked --features server
          --test bitmap_delete_consistency --test union_count_cross_block
          --test frequent_topk_consistency
          --test union_topk_fill_ranking --test union_topk_many_terms
      # Preserve every lexical case and its data scale, but give this independent
      # target its own 30-minute job instead of sharing the core job deadline.
      - name: Small lexical membership and scoring oracles
        if: matrix.lane == 'lexical'
        run: cargo test -p anyseek --locked --features server --test lexical_correctness
      - name: Build service with the same feature set
        if: matrix.lane == 'core'
        run: cargo build -p anyseek --locked --features server
      - name: Committed asynchronous-index HTTP and authorization regressions
        if: matrix.lane == 'core'
        run: cargo test -p anyseek --locked --features server --bin anyseek_server committed_ingest_
      - name: Service configuration and OpenAPI smoke
        if: matrix.lane == 'core'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            target/debug/anyseek_server.exe generate_openapi=true
          else
            target/debug/anyseek_server generate_openapi=true
          fi

  full-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    uses: ./.github/workflows/full-acceptance.yml
