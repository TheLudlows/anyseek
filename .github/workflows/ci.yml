name: Retained workspace

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retained-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # target-cpu=native artifacts cannot be shared across heterogeneous runners.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: s12-native-source-only
          cache-targets: false
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
          lscpu
      - name: Build retained workspace
        id: build
        run: cargo build --workspace
      - name: Verify retired dependencies removed
        run: |
          cargo metadata --format-version 1 > /tmp/seekpower-metadata.json
          python3 - <<'PYCODE'
          import json
          with open('/tmp/seekpower-metadata.json') as source:
              packages = json.load(source)['packages']
              names = {package['name'] for package in packages}
          forbidden = names & {'pdfium-render', 'csv', 'walkdir', 'symspell_complete_rs'}
          assert not forbidden, f'retired dependencies remain: {forbidden}'
          core = next(package for package in packages if package['name'] == 'seekstorm')
          assert not any(dependency['name'] == 'aho-corasick' for dependency in core['dependencies']), 'direct highlighter dependency remains'
          # regex still uses aho-corasick transitively; the tokenizer is retained.
          print('PASS no direct highlighter dependency')
          print('PASS no PDF/CSV/directory parser or query rewriting dependencies in resolved graph')
          PYCODE
      - name: Install browser test runtime
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: HTTP API and embedded UI smoke (no SDK)
        env:
          SEEKPOWER_BROWSER_TEST: "1"
        run: python3 scripts/http_smoke.py --server target/debug/seekstorm_server
      - name: Existing core and server tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --workspace --all-targets
      - name: Generate API reference
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          target/debug/seekstorm_server generate_openapi=true > /dev/null
          diff -u seekstorm_server/openapi/openapi.json target/debug/openapi.json
          diff -u seekstorm_server/openapi/openapi.yml target/debug/openapi.yml
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: |
            target/debug/openapi.json
            target/debug/openapi.yml
