name: PR feedback

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full:
        description: Run complete manual acceptance on the selected ref
        type: boolean
        default: false


permissions:
  contents: read

concurrency:
  group: pr-feedback-${{ github.ref }}-${{ inputs.full && 'full' || 'quick' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-source-only
          cache-targets: false
      - name: Determine validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          base = os.environ.get('BASE_SHA', '')
          code = True
          if base and set(base) != {'0'}:
              files = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              code = any(not (p.endswith('.md') or p.startswith('docs/')) for p in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'code={str(code).lower()}\n')
          PYCODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build standalone console and verify precise writes/retries
        if: steps.scope.outputs.code == 'true'
        run: |
          npm ci --prefix console
          npm test --prefix console
          npm run build --prefix console
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.code == 'true'
        with:
          name: anyseek-console
          path: console/dist/

      - name: Verify standalone console boundary
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/check_console_boundary.py
      - name: Verify S3 semantic suite coverage
        run: python3 scripts/test_s3_acceptance.py
      - name: Verify full-size lexical partition remains complete
        run: python3 scripts/check_lexical_partition.py --source-only
      - name: Verify retired dependencies removed
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/check_retired_dependencies.py

  core:
    name: Core feedback (${{ matrix.os }}, ${{ matrix.lane }})
    needs: static
    if: needs.static.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        lane: [core, lexical]
    runs-on: ${{ matrix.os }}
    # Keep the existing job budget; long-suffix recovery runs in manual acceptance.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.lane == 'core' && 45 || 30 }}
    env:
      # Generic CPU makes target artifacts portable across runners of this OS.
      RUSTFLAGS: "-C target-cpu=x86-64"
      RUSTDOCFLAGS: "-C target-cpu=x86-64"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      ANYSEEK_TEST_SCALE: small
      ANYSEEK_TEST_ROOT: ${{ github.workspace }}/target/anyseek-ci-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-generic-core-v1
      - name: Prepare isolated test root
        shell: bash
        run: mkdir -p "$ANYSEEK_TEST_ROOT"
      - name: Exact bounded core regressions (including WAL owner lock)
        if: matrix.lane == 'core'
        run: python scripts/ci_core_cases.py
      - name: Small deletion and ranking oracles
        if: matrix.lane == 'core'
        run: >-
          cargo test -p anyseek --locked
          --test bitmap_delete_consistency --test union_count_cross_block
          --test frequent_topk_consistency
          --test union_topk_fill_ranking --test union_topk_many_terms
      # Preserve every lexical case and its data scale, but give this independent
      # target its own 30-minute job instead of sharing the core job deadline.
      - name: Small lexical membership and scoring oracles
        if: matrix.lane == 'lexical'
        run: cargo test -p anyseek --locked --test lexical_correctness
      - name: Build service with the same feature set
        if: matrix.lane == 'core'
        run: cargo build -p anyseek --locked
      - name: Committed asynchronous-index HTTP and authorization regressions
        if: matrix.lane == 'core'
        run: cargo test -p anyseek --locked --bin anyseek_server committed_ingest_
      - name: Service persistence fences and shutdown ownership
        if: matrix.lane == 'core'
        shell: bash
        run: |
          cargo test -p anyseek --locked --features fault-injection --bin anyseek_server record_service::tests::service_data_fence_preserves_persistence_errors -- --exact
          cargo test -p anyseek --locked --features fault-injection --bin anyseek_server record_service::tests::shutdown_
      - name: Real SIGTERM drains owned work and releases the root
        if: matrix.lane == 'core' && runner.os == 'Linux'
        run: |
          cargo build -p anyseek --locked --features fault-injection --bin anyseek_server
          python scripts/record_shutdown_smoke.py --server target/debug/anyseek_server
      - name: Service configuration and OpenAPI smoke
        if: matrix.lane == 'core'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            target/debug/anyseek_server.exe generate_openapi=true
          else
            target/debug/anyseek_server generate_openapi=true
          fi
      - uses: actions/setup-node@v4
        if: matrix.lane == 'core' && runner.os == 'Linux'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Standalone console against disposable real API
        if: matrix.lane == 'core' && runner.os == 'Linux'
        working-directory: console
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
          npx playwright test --config playwright.bootstrap.config.ts
      - uses: actions/upload-artifact@v4
        if: always() && matrix.lane == 'core' && runner.os == 'Linux'
        with:
          name: console-browser-results
          path: console/test-results/

      - name: Deleted collection reclamation (local and S3 fixture)
        if: matrix.lane == 'core'
        shell: bash
        run: |
          cargo test -p anyseek --bin anyseek_server record_service::tests::reclamation_waits_for_service_backup_before_catalog_lifecycle -- --exact --nocapture
          server_binary=target/debug/anyseek_server
          if [ "${{ runner.os }}" = "Windows" ]; then
            server_binary=target/debug/anyseek_server.exe
          fi
          python scripts/record_reclamation_smoke.py --server "$server_binary" --backend local
          python scripts/record_reclamation_smoke.py --server "$server_binary" --backend fixture

  full-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    uses: ./.github/workflows/full-acceptance.yml
