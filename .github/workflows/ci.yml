name: PR feedback

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full:
        description: Run only full acceptance on the selected ref
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pr-feedback-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Generic CPU makes target artifacts portable across runners of the same OS.
  RUSTFLAGS: "-C target-cpu=x86-64"
  RUSTDOCFLAGS: "-C target-cpu=x86-64"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  ANYSEEK_TEST_SCALE: small

jobs:
  static:
    if: github.event_name != 'workflow_dispatch' || !inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      console: ${{ steps.scope.outputs.console }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PYCODE'
          import os
          import subprocess

          base = os.environ.get('BASE_SHA', '')
          backend = console = True
          if base and set(base) != {'0'}:
              try:
                  diff = subprocess.check_output([
                      'git', 'diff', '--no-renames', '--name-only', '-z', base, 'HEAD', '--'
                  ])
              except subprocess.CalledProcessError:
                  print('::warning::Unable to determine changed paths. Running all quick checks.')
              else:
                  paths = [os.fsdecode(path) for path in diff.split(b'\0') if path]
                  paths = [
                      path for path in paths
                      if not path.endswith('.md')
                      and not path.startswith(('docs/', '.agents/', 'benchmarks/', 'miracl-corpus-v1.0-zh/'))
                      and path != '.github/workflows/full-acceptance.yml'
                  ]
                  console = any(path.startswith('console/') for path in paths)
                  backend = any(not path.startswith('console/') for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'backend={str(backend).lower()}\n')
              output.write(f'console={str(console).lower()}\n')
          PYCODE
      - name: Verify standalone console boundary
        if: steps.scope.outputs.backend == 'true' || steps.scope.outputs.console == 'true'
        run: python3 scripts/check_console_boundary.py
      - name: Verify S3 semantic suite coverage
        run: python3 scripts/test_s3_acceptance.py
      - name: Verify full-size lexical partition remains complete
        run: python3 scripts/check_lexical_partition.py --source-only

  console:
    name: Console feedback
    needs: static
    if: needs.static.outputs.console == 'true' && needs.static.outputs.backend == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-generic-core-v1
          shared-key: ubuntu-24.04-core
          save-if: 'false'
      - name: Build service for the browser suite
        run: cargo build -p anyseek --locked --bin anyseek_server
      - uses: ./.github/actions/check-console
        with:
          browser-artifact: console-browser-results

  core:
    name: Core feedback (${{ matrix.os }}, ${{ matrix.lane }})
    needs: static
    if: needs.static.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        lane: [core, lexical]
    # Playwright 1.56.1 supports Ubuntu 24.04; pin the Linux browser lane.
    # Preserve the existing feedback check names while ubuntu-latest advances.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && matrix.lane == 'core' && 'ubuntu-24.04' || matrix.os }}
    # Keep the existing job budget; long-suffix recovery runs in manual acceptance.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.lane == 'core' && 45 || 30 }}
    env:
      ANYSEEK_TEST_ROOT: ${{ github.workspace }}/target/anyseek-ci-core
      SERVER_BINARY: ${{ matrix.os == 'windows-latest' && 'target/debug/anyseek_server.exe' || 'target/debug/anyseek_server' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-generic-core-v1
          shared-key: ${{ matrix.os == 'ubuntu-latest' && matrix.lane == 'core' && 'ubuntu-24.04-core' || '' }}
      - name: Prepare isolated test root
        shell: bash
        run: mkdir -p "$ANYSEEK_TEST_ROOT"
      - name: Verify retired dependencies removed
        if: matrix.lane == 'core' && runner.os == 'Linux'
        run: python scripts/check_retired_dependencies.py
      - name: Exact bounded core regressions (including WAL owner lock)
        if: matrix.lane == 'core'
        run: python scripts/ci_core_cases.py
      - name: Small deletion and ranking oracles
        if: matrix.lane == 'core'
        run: >-
          cargo test -p anyseek --locked
          --test bitmap_delete_consistency --test union_count_cross_block
          --test frequent_topk_consistency
          --test union_topk_fill_ranking --test union_topk_many_terms
      # Preserve every lexical case and its data scale, but give this independent
      # target its own 30-minute job instead of sharing the core job deadline.
      - name: Small lexical membership and scoring oracles
        if: matrix.lane == 'lexical'
        run: cargo test -p anyseek --locked --test lexical_correctness
      - name: Retrieval configuration and request diagnostics
        if: matrix.lane == 'core'
        run: cargo test -p anyseek --locked --lib server::record_service::diagnostic_tests -- --test-threads=1
      - name: Embedded SDK and ordered snapshot recovery
        if: matrix.lane == 'core' && runner.os == 'Linux'
        run: |
          cargo test -p anyseek --locked --no-default-features --test local_sdk --test local_time_vector
          cargo test -p anyseek --locked --no-default-features --lib record::state_chunks::tests::chunks_preserve_records_receipts_opaque_json_and_owned_residency -- --exact
      - name: Build default-feature service for smoke tests
        if: matrix.lane == 'core'
        run: cargo build -p anyseek --locked --bin anyseek_server
      - name: Service configuration and OpenAPI smoke
        if: matrix.lane == 'core'
        shell: bash
        run: |
          "$SERVER_BINARY" generate_openapi=true
          python scripts/record_service_smoke.py --server "$SERVER_BINARY" --section startup
      - name: Deleted collection reclamation (local and S3 fixture)
        if: matrix.lane == 'core'
        shell: bash
        run: |
          python scripts/record_reclamation_smoke.py --server "$SERVER_BINARY" --backend local
          python scripts/record_reclamation_smoke.py --server "$SERVER_BINARY" --backend fixture
      - uses: ./.github/actions/check-console
        if: matrix.lane == 'core' && runner.os == 'Linux'
        with:
          browser-artifact: console-browser-results

  write-path:
    name: Write path (${{ matrix.os }})
    needs: static
    if: needs.static.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ANYSEEK_TEST_ROOT: ${{ github.workspace }}/target/anyseek-ci-write-path
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ci-generic-write-path-v1
      - name: Prepare isolated test root
        shell: bash
        run: mkdir -p "$ANYSEEK_TEST_ROOT"
      - name: Exact write, publication fence and shutdown regressions
        run: python scripts/ci_write_path_cases.py
      - name: Real SIGTERM drains owned work and releases the root
        if: runner.os == 'Linux'
        run: |
          cargo build -p anyseek --locked --features fault-injection --bin anyseek_server
          python scripts/record_shutdown_smoke.py --server target/debug/anyseek_server

  full-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    uses: ./.github/workflows/full-acceptance.yml
