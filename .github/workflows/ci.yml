name: Retained workspace

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retained-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Build retained workspace
        id: build
        run: cargo build --workspace
      - name: Install browser test runtime
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: HTTP API and embedded UI smoke (no SDK)
        env:
          SEEKPOWER_BROWSER_TEST: "1"
        run: python3 scripts/http_smoke.py --server target/debug/seekstorm_server
      - name: Existing core and server tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --workspace --all-targets
      - name: Generate API reference
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          target/debug/seekstorm_server generate_openapi=true > /dev/null
          python3 -c 'import json; from pathlib import Path; print("OPENAPI_JSON=" + json.dumps(Path("target/debug/openapi.json").read_text())); print("OPENAPI_YAML=" + json.dumps(Path("target/debug/openapi.yml").read_text()))'
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: |
            target/debug/openapi.json
            target/debug/openapi.yml
