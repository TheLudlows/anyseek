[package]
name = "anyseek"
version = "3.4.1"
authors = ["Wolf Garbe <wolf.garbe@seekstorm.com>"]
license = "Apache-2.0"
categories = ["database-implementations", "data-structures"]
description = """Vector & lexical search engine library & multi-tenancy server"""
documentation = "https://github.com/TheLudlows/anyseek#readme"
homepage = "https://github.com/TheLudlows/anyseek"
repository = "https://github.com/TheLudlows/anyseek"
readme = "../README.md"
keywords = ["search", "information", "retrieval"]
edition = "2024"
publish = false

[features]
# Optional features: zh=Chinese word segmentation, vb=result diagnostics.
# You can also disable all default features and re-enable them case-wise in your toml with: anyseek = { path = "../anyseek", default-features = false, features = ["zh"] }
default = ["zh","vb"]
zh = ["dep:tantivy-jieba", "dep:jieba-rs"]
vb = []
# Explicit test binaries only; no remote activation endpoint.
fault-injection = []
# HTTP dependencies are absent from the default core dependency graph.
s3-object-store = ["dep:object_store"]
server = ["dep:http-body", "dep:env_logger", "dep:axum", "dep:utoipa", "s3-object-store"]

[[bin]]
name = "anyseek_server"
path = "src/server/main.rs"
required-features = ["server"]

[lib]
name = "anyseek"
path = "src/lib.rs"

[dependencies]
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
tantivy-jieba = { version = "=0.21.0", optional = true }
# Pin dictionary/algorithm identity, including the adapter's transitive dependency.
jieba-rs = { version = "=0.11.0", optional = true }
http-body = { version = "1", optional = true }
env_logger = { version = "0.11", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "http2", "json", "query", "tokio", "matched-path"] }
utoipa = { version = "6.0.0", optional = true, features = ["preserve_order", "preserve_path_order", "yaml", "indexmap"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
object_store = { version = "0.12", optional = true, default-features = false, features = ["aws"] }
xxhash-rust = { version = "=0.8.15", default-features = false, features = ["xxh64"] }
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
tokio = { version = "1.53.2", features = ["full"] }
base64 = "0.23.1"
ahash ={ version = "0.8.12", features = ["serde"]}
rand = { version = "0.10.3", features = ["chacha"]}
futures = "0.3.34"
num = "0.4.3"
num-derive = "0.5.1"
num-traits = "0.2.19"
itertools = "0.15.0"
memmap2 = "0.9.11"
regex-syntax = "0.8.11"
indexmap = { version = "2.14.2", features = ["serde"]}
unicode-normalization = "0.1.25"
finl_unicode = "1.4.0"
sha2 = "0.11.0"
num_cpus = "1.17.0"
bytemuck = { version = "1.25.2", features = ["derive","extern_crate_alloc"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
tokio-test = "0.4.6"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version ="0.3.9",  features = ["winbase", "processthreadsapi"]}

[lints]
workspace = true

[package.metadata.docs.rs]
rustc-args = ["-C", "target-cpu=native"]
rustdoc-args = ["-C", "target-cpu=native"]
