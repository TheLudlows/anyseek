[package]
name = "seekpower_server"
version = "3.4.1"
authors = ["Wolf Garbe <wolf.garbe@seekstorm.com>"]
license = "Apache-2.0"
categories = ["database-implementations", "data-structures"]
description = """Vector & lexical search engine library & multi-tenancy server"""
documentation = "https://github.com/TheLudlows/seekpower#readme"
homepage = "https://github.com/TheLudlows/seekpower"
repository = "https://github.com/TheLudlows/seekpower"
readme = "README.md"
keywords = ["search", "information", "retrieval"]
edition = "2024"
publish = false

[features]
default = ["zh","vb"]
zh = ["seekpower/zh"]
vb = ["seekpower/vb"]

[[bin]]
name = "seekpower_server"
path = "src/main.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
seekpower = { version = "3.4.1", path = "../seekpower" , default-features = false}
base64 = "0.23.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
utoipa-axum = "0.3"
indexmap = { version = "2.14.2", features = ["serde"] }
itertools = "0.15.0"
num_cpus = "1.17.0"
rand = { version = "0.10.3", features = ["chacha"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
utoipa = { version ="6.0.0",  features = ["preserve_order","preserve_path_order","yaml","indexmap"]}

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winbase", "processthreadsapi"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustc-args = ["-C", "target-cpu=native"]
rustdoc-args = ["-C", "target-cpu=native"]
