[package]
name = "seekstorm"
version = "3.4.1"
authors = ["Wolf Garbe <wolf.garbe@seekstorm.com>"]
license = "Apache-2.0"
categories = ["database-implementations", "data-structures"]
description = """Vector & lexical search engine library & multi-tenancy server"""
documentation = "https://docs.rs/seekstorm/"
homepage = "https://seekstorm.com"
repository = "https://github.com/SeekStorm/SeekStorm"
readme = "../README.md"
keywords = ["search", "information", "retrieval"]
edition = "2024"
publish = false # Build this fork from source; do not publish under upstream crate names.
exclude = ["assets/*.png","assets/*.jpg"]

[features]
# comment out the default features below you don't need: zh=Chinese word segmentation, gxhash=GXHash instead of AHash for faster hash computation.
# You can also disable all default features and re-enable them case-wise in your toml with: seekstorm = { path = "../seekstorm", default-features = false, features = ["zh"] }
default = ["zh","vb"]
zh = []
vb = []
gxhash = ["dep:gxhash"] # Activate gxhash when you hardware supports AES/SSE2 and you want faster hash computation.

[lib]
name = "seekstorm"
path = "src/lib.rs"

[dependencies]
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.2", features = ["full"] }
base64 = "0.23.1"
ahash ={ version = "0.8.12", features = ["serde"]}
gxhash = { version = "3.5.0", features = ["deterministic"], optional = true }
rand = { version = "0.10.3", features = ["chacha"]}
futures = "0.3.34"
num = "0.4.3"
num-derive = "0.5.1"
num-traits = "0.2.19"
itertools = "0.15.0"
async-recursion = "1.2.0"
zstd = "0.14.2"
smallvec = "1.16.3"
memmap2 = "0.9.11"
regex-syntax = "0.8.11"
indexmap = { version = "2.14.2", features = ["serde"]}
unicode-normalization = "0.1.25"
finl_unicode = "1.4.0"
num_cpus = "1.17.0"
snap = "1.1.2"
lz4_flex = "0.14.0"
bytemuck = { version = "1.25.2", features = ["derive","extern_crate_alloc"] }
snowball_stemmers_rs = "1.0.1"
half = { version = "2.7.1", features = ["bytemuck","serde"] }

[dev-dependencies]
tokio-test = "0.4.6"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version ="0.3.9",  features = ["winbase"]}

[lints]
workspace = true

[package.metadata.docs.rs]
rustc-args = ["-C", "target-cpu=native"]
rustdoc-args = ["-C", "target-cpu=native"]
